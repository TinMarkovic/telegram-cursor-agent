# No clone required. Put this file next to a tiny .env and run: docker compose up -d
# curl -fsSL https://raw.githubusercontent.com/TinMarkovic/telegram-cursor-agent/main/compose.yml -o compose.yml

services:
  telegram-cursor-agent:
    image: ghcr.io/tinmarkovic/telegram-cursor-agent:latest
    restart: unless-stopped
    env_file: .env
    environment:
      WORKSPACE_PATH: /workspace
    volumes:
      - ${TCA_WORKSPACE}:/workspace
      - tca_data:/app/data

volumes:
  tca_data:
